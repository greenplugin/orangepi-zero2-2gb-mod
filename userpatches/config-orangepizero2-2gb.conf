#
# Configuration for Orange Pi Zero 2 with 2GB RAM modification (H5TC8G63AMR)
#

BOARD="orangepizero2"
BRANCH="next"
RELEASE="jammy"
BUILD_OPT="image"
BUILD_MINIMAL="no"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"
KERNEL_TARGET="next"

# Network & mirror settings
DOWNLOAD_MIRROR=""
USE_TORRENT="no"
NO_APT_CACHER="yes"

# Use pre-installed Docker GCC cross-compilers instead of downloading external toolchains
SKIP_EXTERNAL_TOOLCHAINS="yes"

# Clean target
CLEAN_LEVEL="make"

# Compression
COMPRESS_OUTPUTIMAGE="no"

# Locale
DEST_LANG="en_US.UTF-8"

# Enable 2GB DRAM force flag in u-boot compiler flags
EXTRA_CFLAGS="-DCONFIG_ORANGEPI_ZERO2_2GB=1"

# Target user credentials (can be overridden via .env)
OPI_USERNAME="${DEFAULT_USERNAME:-ubuntu}"
OPI_PWD="${DEFAULT_PASSWORD:-ubuntu}"
ROOTPWD="${ROOT_PASSWORD:-ubuntu}"
